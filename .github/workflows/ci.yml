name: Gomovie CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, curl, fileinfo, openssl, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg for mandatory synthetic encoding smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          /usr/bin/ffmpeg -version | head -n 1
          /usr/bin/ffprobe -version | head -n 1
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate PHP syntax
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l
      - name: Build frontend assets
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Test private edge grant logic
        run: node --test workers/gomovie-media-edge/worker.test.mjs
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run fresh database migration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --force
      - name: Rehearse independent SQLite installation and offline recovery
        run: |
          bash -n support/recovery-rehearsal.sh
          bash support/recovery-rehearsal.sh
      - name: Run feature and unit tests
        env:
          GOMOVIE_REQUIRE_FFMPEG_SMOKE: '1'
        run: vendor/bin/phpunit --colors=never
