name: Gomovie CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, curl, fileinfo, openssl, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg for mandatory synthetic encoding smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          /usr/bin/ffmpeg -version | head -n 1
          /usr/bin/ffprobe -version | head -n 1
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate PHP syntax
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l
      - name: Syntax check selective aaPanel Watch updater
        run: bash -n support/watch-page-upgrade.sh
      - name: Syntax check selective aaPanel Upload Studio updater
        run: bash -n support/upload-studio-upgrade.sh
      - name: Verify Upload Studio backup bootstraps Composer before Laravel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('support/upload-studio-upgrade.sh').read_text()
          autoload = "require_once getenv('APP_PATH').'/vendor/autoload.php';"
          bootstrap = "$app=require getenv('APP_PATH').'/bootstrap/app.php';"
          assert script.count(autoload) == 1, "Missing or duplicated Composer autoload"
          assert script.count(bootstrap) == 1, "Unexpected Laravel bootstrap"
          assert script.index(autoload) < script.index(bootstrap), "Laravel loaded before Composer"
          assert 'test -f "$APP/vendor/autoload.php"' in script, "Missing vendor preflight"
          PY
      - name: Verify standalone Upload Studio helper and browser JavaScript
        run: |
          bash -n support/standalone-upload-studio-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path

          view = Path('resources/views/admin/upload-studio.blade.php').read_text()
          assert view.count('<script>') == 1 and view.count('</script>') == 1
          js = view.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/gomovie-upload-studio.js').write_text(js)
          assert js.index('const payload = new FormData(form);') < js.index('busy(true);')
          PY
          node --check /tmp/gomovie-upload-studio.js
      - name: Syntax check one-click Upload Studio recovery updater
        run: bash -n support/upload-studio-one-click-recovery.sh
      - name: Build frontend assets
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Test private edge grant logic
        run: node --test workers/gomovie-media-edge/worker.test.mjs
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run fresh database migration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --force
      - name: Rehearse independent SQLite installation and offline recovery
        run: |
          bash -n support/recovery-rehearsal.sh
          bash support/recovery-rehearsal.sh
      - name: Run feature and unit tests
        env:
          GOMOVIE_REQUIRE_FFMPEG_SMOKE: '1'
        run: vendor/bin/phpunit --colors=never
