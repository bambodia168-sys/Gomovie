name: Gomovie CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, curl, fileinfo, openssl, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg for mandatory synthetic encoding smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          /usr/bin/ffmpeg -version | head -n 1
          /usr/bin/ffprobe -version | head -n 1
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate PHP syntax
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l
      - name: Syntax check selective aaPanel Watch updater
        run: bash -n support/watch-page-upgrade.sh
      - name: Syntax check selective aaPanel Upload Studio updater
        run: bash -n support/upload-studio-upgrade.sh
      - name: Syntax check selective Studio feedback and artwork upgrade
        run: bash -n support/studio-feedback-artwork-upgrade.sh
      - name: Verify custom authentication layout is preserved by Studio recovery
        run: |
          bash -n support/studio-feedback-custom-auth-recovery.sh
          python3 - <<'PY'
          import pathlib, re, shutil, subprocess, tempfile
          script = pathlib.Path('support/studio-feedback-custom-auth-recovery.sh').read_text()
          match = re.search(r"auth_plan\(\) \{\n  python3 - \"\$1\" \"\$2\" <<'PY'\n(.*?)\nPY", script, re.S)
          assert match, 'Missing isolated custom-auth patch'
          assert 'cp -p "$BACKUP/original/$AUTH" "$BACKUP/release/$AUTH"' in script
          assert 'test "$(git hash-object "$APP/$AUTH")" = "$ORIGINAL_AUTH_BLOB"' in script
          assert 'artisan migrate' not in script
          patch = match.group(1)
          with tempfile.TemporaryDirectory() as work:
              root = pathlib.Path(work)
              source = root / 'auth.blade.php'
              prepared = root / 'prepared.blade.php'
              custom = '<html><head><meta charset="utf-8"></head><body><main>Existing private design</main></body></html>'
              source.write_text(custom)
              source.chmod(0o640)
              shutil.copy2(source, prepared)
              subprocess.run(['python3','-c',patch,str(source),str(prepared)],check=True)
              expected = custom.replace('</head>', "@include('partials.feedback')\n</head>")
              assert prepared.read_text() == expected, 'Custom layout was not preserved'
              assert source.read_text() == custom, 'Original custom layout changed'
              assert prepared.stat().st_mode & 0o777 == 0o640, 'Original permissions not retained'
              prepared.write_text(expected)
              subprocess.run(['python3','-c',patch,str(prepared),'--check'],check=True)
              assert prepared.read_text() == expected, 'Idempotence check changed the layout'
          PY
      - name: Syntax check read-only Upload Studio live audit
        run: |
          bash -n support/upload-studio-live-audit.sh
          ! grep -Eq 'artisan (migrate|optimize:clear)|--apply|install -[a-z]|rm -f' support/upload-studio-live-audit.sh
      - name: Verify Upload Studio backup bootstraps Composer before Laravel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('support/upload-studio-upgrade.sh').read_text()
          autoload = "require_once getenv('APP_PATH').'/vendor/autoload.php';"
          bootstrap = "$app=require getenv('APP_PATH').'/bootstrap/app.php';"
          assert script.count(autoload) == 1, "Missing or duplicated Composer autoload"
          assert script.count(bootstrap) == 1, "Unexpected Laravel bootstrap"
          assert script.index(autoload) < script.index(bootstrap), "Laravel loaded before Composer"
          assert 'test -f "$APP/vendor/autoload.php"' in script, "Missing vendor preflight"
          PY
      - name: Verify standalone Upload Studio helper and browser JavaScript
        run: |
          bash -n support/standalone-upload-studio-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path

          view = Path('resources/views/admin/upload-studio.blade.php').read_text()
          assert view.count('<script>') == 1 and view.count('</script>') == 1
          js = view.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/gomovie-upload-studio.js').write_text(js)
          assert js.index('const payload = new FormData(form);') < js.index('busy(true);')
          PY
          node --check /tmp/gomovie-upload-studio.js
      - name: Syntax check one-click Upload Studio recovery updater
        run: bash -n support/upload-studio-one-click-recovery.sh
      - name: Syntax check upload approval-page removal helper
        run: bash -n support/remove-upload-approval-page.sh
      - name: Syntax check real five-stage Upload Studio deployment
        run: bash -n support/sample-inspired-real-upload-upgrade.sh
      - name: Syntax check private watch preview deployment helper
        run: bash -n support/private-watch-preview-upgrade.sh
      - name: Validate modern player upgrade helper and pinned CI source
        run: |
          bash -n support/modern-player-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path("support/modern-player-upgrade.sh").read_text()
          expected = {
            "resources/js/player.js": "d05f8b6f93d2498a42fd726eb601109b1a0f1dad",
            "resources/css/app.css": "5669e6515c766698dcf86ab22ac7e4e95f06b713",
            "resources/views/frontend/detail.blade.php": "b5827ebe707d4ba3c2dcfdf6810817ad1feea9fe",
            "app/Support/PlayerPreferences.php": "88749cb111c419703b080296d0b4f06493509bcc",
            "database/migrations/2026_11_09_000200_create_player_preferences_table.php": "4293a65f960b8a72528712070acda6e4d5787ae6",
          }
          # Previous production helper is pinned to an older release:
          # preserve its hashes while newer player sources advance.
          for filename, sha in expected.items():
            assert filename in script, filename
            assert sha in script, (filename, sha)
          assert "sha256sum \"$ZIP\" | awk" in script
          assert "SOURCE_ROLLBACK=COMPLETE" in script
          assert "PRIVATE_PREVIEW_SECURITY=UNCHANGED" in script
          PY
      - name: Verify portrait player control regression guards
        run: |
          node --check resources/js/player.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path("resources/css/app.css").read_text()
          js=Path("resources/js/player.js").read_text()
          controls=Path("resources/views/frontend/partials/modern-player-controls.blade.php").read_text()
          assert ".gm-player-stage{container-type:inline-size}" in css
          assert "@container (max-width: 560px)" in css
          assert ".is-portrait .gm-modern-toolbar{display:grid" in css
          assert ".is-portrait .gm-modern-volume{display:none}" in css
          assert ".gm-modern-menu-volume{display:flex" in css
          assert ".gm-modern-ui [hidden]{display:none!important}" in css
          assert "data-gm-menu-volume" in controls
          assert "data-gm-menu-pip" in controls
          assert "data-captions-toggle" in controls
          assert "data-gm-view-mode" in controls
          assert "data-gm-ad-layer" in controls
          assert "data-gm-menu-volume" in controls
          assert "data-gm-volume-percent" in controls
          assert "data-gm-settings-close" in controls
          assert "gm-icon-expand" in controls and "gm-icon-collapse" in controls
          assert "gm-modern-settings-button" in controls
          assert "const updateCapabilities" in js
          assert "video.dataset.gmSubtitleCount" in js
          assert "video.textTracks?.addEventListener?.('addtrack'" in js
          assert "'/api/v1/stream/' + type + '/' + titleId + '/token'" in js
          PY
      - name: Test single speaker volume control
        run: |
          node --check resources/js/player.js
          node --test tests/javascript/player-volume.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          markup=Path("resources/views/frontend/partials/modern-player-controls.blade.php").read_text()
          css=Path("resources/css/app.css").read_text()
          js=Path("resources/js/player.js").read_text()
          assert markup.count("data-gm-menu-volume") == 1
          assert markup.count("data-gm-volume-popover") == 1
          assert "gm-settings-audio" not in markup
          assert "gm-modern-volume-popover" in css
          assert "data-gm-volume-popover" in js
          assert "event.key === 'Escape'" in js
          print("GOMOVIE_SINGLE_VOLUME_CONTROL=VERIFIED")
          PY
      - name: Test premium fullscreen SVG control behavior
        run: |
          node --check resources/js/player.js
          node --test tests/javascript/player-fullscreen.test.mjs
      - name: Verify premium player UX and protected ad integration contract
        run: |
          node --check resources/js/player.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path("resources/js/player.js").read_text()
          css=Path("resources/css/app.css").read_text()
          blade=Path("resources/views/frontend/detail.blade.php").read_text()
          controls=Path("resources/views/frontend/partials/modern-player-controls.blade.php").read_text()
          assert "video.videoHeight > video.videoWidth" in js
          assert "video.addEventListener('loadedmetadata', detectOrientation)" in js
          assert "applyViewMode(viewSelect.value, true)" in js
          assert "document.activeElement" in js and "keyboardInteracting" in js
          assert "data-gm-menu-volume" in controls and "data-gm-volume-percent" in controls
          assert "data-gm-volume aria-label" not in controls
          assert "gm-mode-switch" not in blade
          assert "gm-watch-title-block" in blade and "gm-watch-info-actions" in blade
          assert blade.index("<h2>{{ $title->title }}</h2>") < blade.index('<div class="gm-watch-tags">')
          assert "data-gm-ad-layer hidden" in controls
          assert "root.addEventListener('gomovie:ad-start'" in js
          assert "root.addEventListener('gomovie:ad-end'" in js
          assert "gomovie:ad-skip-request" in js
          assert "video.pause();" in js
          assert "gm-player-soft-glow" in css and "gm-player-spinner" in css
          assert ".gm-player-stage:fullscreen" in css
          print("GOMOVIE_PREMIUM_PLAYER=VERIFIED")
          PY
      - name: Verify portrait player aaPanel upgrade helper
        run: |
          bash -n support/portrait-player-controls-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path("support/portrait-player-controls-upgrade.sh").read_text()
          assert 'TESTED_SHA="400b7c09c0e40c239577a75ddcb1903457ff9828"' in script
          assert 'BUILD_RUN="42583509288"' in script
          assert 'GOMOVIE_PORTRAIT_DEPLOYMENT=SUCCESS' in script
          assert 'SOURCE_ROLLBACK=COMPLETE' in script
          assert 'DATABASE_CHANGED=NO' in script
          PY
      - name: Verify premium player pinned production upgrade
        run: |
          bash -n support/premium-player-ui-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path("support/premium-player-ui-upgrade.sh").read_text()
          assert 'TESTED_SHA="b4ea9ce0144827e6982a957a8177f1205f008c73"' in script
          assert 'SOURCE_SHA="b4ea9ce0144827e6982a957a8177f1205f008c73"' in script
          assert 'BUILD_RUN="42615556518"' in script
          assert 'GOMOVIE_PREMIUM_PLAYER_DEPLOYMENT=SUCCESS' in script
          assert 'SOURCE_ROLLBACK=COMPLETE' in script
          assert 'GOMOVIE_PREMIUM_PLAYER_PREFLIGHT=PASS' in script
          assert 'COMPILED_ASSET_ALLOWLIST=VERIFIED' in script
          assert 'DATABASE_CHANGED=NO' in script
          assert 'PRIVATE_PREVIEW=UNCHANGED' in script
          assert 'FONTS_MANIFEST=VERIFIED' in script
          for expected in [
            '3a49e01fc2f438d80d98800fe390560b782c86d6',
            'aaac5952037597d205a03bfdf54744aacdc14f05',
            '96f299fec273360799d094f61e435eeb73d395ea',
            'c1ace9f5393fc61c31ba60b0712ec61eaf691232',
          ]:
              assert expected in script
          print("GOMOVIE_PREMIUM_PLAYER_DEPLOYMENT_HELPER=VERIFIED")
          PY
      - name: Validate pinned fullscreen SVG upgrade helper
        run: |
          bash -n support/fullscreen-icon-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path("support/fullscreen-icon-upgrade.sh").read_text()
          expected={
            "resources/css/app.css":("3a49e01fc2f438d80d98800fe390560b782c86d6",
                                     "8208fdb191fca5ef4a8639e4fdeebe04f2a82a39"),
            "resources/js/player.js":("aaac5952037597d205a03bfdf54744aacdc14f05",
                                      "dde44b7f1284dbe8794fd1c7573606731710ea9e"),
            "resources/views/frontend/partials/modern-player-controls.blade.php":
                ("c1ace9f5393fc61c31ba60b0712ec61eaf691232",
                 "5d4a0f26fa7444df64730d4ea247cdf77a021f8b"),
          }
          for filename, blobs in expected.items():
              assert filename in script, filename
              for blob in blobs: assert blob in script, (filename,blob)
          for term in [
            "BUILD_RUN=\"42623108019\"",
            "FULLSCREEN_SVG_COMPILED_ASSETS=VERIFIED",
            "COMPILED_ASSET_ALLOWLIST=VERIFIED",
            "FONTS_MANIFEST=VERIFIED",
            "SOURCE_ROLLBACK=COMPLETE",
            "DATABASE_CHANGED=NO",
            "PRIVATE_PREVIEW=UNCHANGED",
            "GOMOVIE_FULLSCREEN_DEPLOYMENT=SUCCESS",
          ]:
              assert term in script, term
          print("FULLSCREEN_DEPLOY_HELPER=VALID")
          PY
      - name: Validate compact fullscreen release source pins
        run: |
          bash -n support/compact-fullscreen-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          s = Path("support/compact-fullscreen-upgrade.sh").read_text()
          checks = [
            'TESTED_SHA="da8d903b0223803ac8fcb82e879429ae60129c12"',
            'SOURCE_SHA="efd44adbc027e3972e4ce7b08289f2b6bdff3c73"',
            'BUILD_RUN="42626440455"',
            "resources/views/frontend/partials/modern-player-controls.blade.php",
            "166cb5da92f9504bec19d8c72f2a2d836f33d213",
            "d5bd3da4446f068b33b3f9f8ad0daa43b7a0f1e2",
            "COMPACT_FULLSCREEN_COMPILED_ASSETS=VERIFIED",
            "GOMOVIE_COMPACT_FULLSCREEN_DEPLOYMENT=SUCCESS",
            "FONTS_MANIFEST=VERIFIED",
            "SOURCE_ROLLBACK=COMPLETE",
            "EXISTING_MEDIA=UNCHANGED",
            "DATABASE_CHANGED=NO",
          ]
          for check in checks:
            assert check in s, check
          assert "resources/js/player.js \\" not in s
          print("COMPACT_FULLSCREEN_HELPER=VERIFIED")
          PY
      - name: Verify pinned single-volume production upgrade helper
        run: |
          bash -n support/single-volume-upgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("support/single-volume-upgrade.sh").read_text()
          required=[
            'TESTED_SHA="1613b616d9afb424ed201f789de660995b5ae66b"',
            'SOURCE_SHA="b8ac403fc9ff2d8229aefbc9f0cf9ba43cecdc9a"',
            'BUILD_RUN="42629682460"',
            'GOMOVIE_SINGLE_VOLUME_PREFLIGHT=PASS',
            'SINGLE_VOLUME_COMPILED_ASSETS=VERIFIED',
            'GOMOVIE_SINGLE_VOLUME_DEPLOYMENT=SUCCESS',
            'SPEAKER_POPOVER=SINGLE_VERTICAL_SLIDER',
            'GEAR_AUDIO_SECTION=REMOVED',
            'SOURCE_ROLLBACK=COMPLETE',
            'CI_PACKAGE_SHA256=VERIFIED',
            'FONTS_MANIFEST=VERIFIED',
            'DATABASE_CHANGED=NO',
            'EXISTING_MEDIA=UNCHANGED',
            "grep -RlF 'data-gm-volume-popover'",
            "6dcd7cc8a5a7d51ec10130ff42f981ed71e79b73",
            "d9beae59872ffd171e69212c856b559c08b1300a",
            "a3da95ce141e77ef77a951ead7c1d896aec7b68d",
          ]
          for value in required: assert value in s, value
          print("SINGLE_VOLUME_DEPLOYMENT_HELPER=VERIFIED")
          PY
      - name: Build frontend assets
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Verify Vite fonts manifest is an allowed, restorable asset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("public/build")
          manifest = root / "fonts-manifest.json"
          assert manifest.is_file(), "Vite fonts manifest missing"
          assert isinstance(json.loads(manifest.read_text()), (dict, list))
          paths = {str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()}
          assert paths
          assert "manifest.json" in paths
          assert "fonts-manifest.json" in paths
          assert all(p in {"manifest.json", "fonts-manifest.json"} or p.startswith("assets/") for p in paths), paths
          script = Path("support/portrait-player-controls-upgrade.sh").read_text()
          assert "manifest.json|fonts-manifest.json|assets/*" in script
          assert 'FONTS_MANIFEST=VERIFIED' in script
          assert 'FONTS_MANIFEST_BACKUP=VERIFIED' in script
          assert 'cp -p "$BACKUP/old/fonts-manifest.json"' in script
          assert 'rm -f -- "$APP/public/build/fonts-manifest.json"' in script
          print("GOMOVIE_GENERATED_FONT_MANIFEST=VERIFIED")
          PY
          php -r '
          $contents=file_get_contents("public/build/fonts-manifest.json");
          $data=json_decode($contents,true,512,JSON_THROW_ON_ERROR);
          if (!is_array($data)) exit(1);
          echo "FONTS_MANIFEST_PHP_JSON=VERIFIED\\n";
          '
      - name: Test private edge grant logic
        run: node --test workers/gomovie-media-edge/worker.test.mjs
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify private preview route using full JSON route metadata
        run: |
          php artisan route:list --path=dashboard/media/ingests --json | php -r '
          $routes = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
          foreach ($routes as $route) {
              if (($route["name"] ?? "") === "admin.media.ingest-preview"
                  && ($route["uri"] ?? "") === "dashboard/media/ingests/{ingest}/preview"
                  && in_array("GET", explode("|", (string) ($route["method"] ?? "")), true)) {
                  echo "PRIVATE_PREVIEW_ROUTE=VERIFIED\\n";
                  exit(0);
              }
          }
          fwrite(STDERR, "PRIVATE_PREVIEW_ROUTE=NOT_FOUND\\n");
          exit(1);
          '
      - name: Run fresh database migration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --force
      - name: Rehearse independent SQLite installation and offline recovery
        run: |
          bash -n support/recovery-rehearsal.sh
          bash support/recovery-rehearsal.sh
      - name: Run feature and unit tests
        env:
          GOMOVIE_REQUIRE_FFMPEG_SMOKE: '1'
        run: vendor/bin/phpunit --colors=never
